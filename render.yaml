services:
  - type: web
    name: evalai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: AI_PROVIDER
        value: builtin_expert
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
